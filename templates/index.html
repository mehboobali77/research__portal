<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Opportunities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6;
    --panel: #ffffff;
    --ink: #14213d;
    --muted: #5b6b82;
    --line: #d5dde7;
    --teal: #0f8b8d;
    --teal-dark: #0a6466;
    --amber: #c9831a;
    --danger: #b3261e;
    --closed: #9aa5b1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 "Source Sans 3", system-ui, sans-serif;
  }
  h1, h2, h3 { font-family: "Bricolage Grotesque", "Source Sans 3", sans-serif; margin: 0; }
  header { background: var(--ink); color: #fff; padding: 40px 20px 32px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  header h1 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.1; }
  header p { margin: 10px 0 0; color: #b9c6dc; max-width: 52ch; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 8px; }
  .tools input, .tools select {
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); font: inherit; color: inherit;
  }
  .tools input[type=search] { flex: 1 1 240px; }
  button {
    font: 600 1rem "Source Sans 3", sans-serif; padding: 10px 16px;
    border-radius: 8px; border: 1px solid transparent; cursor: pointer;
  }
  .primary { background: var(--teal); color: #fff; }
  .primary:hover { background: var(--teal-dark); }
  .ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .ghost:hover { border-color: var(--ink); }
  .danger { background: transparent; color: var(--danger); border-color: var(--line); }
  .danger:hover { border-color: var(--danger); }
  :focus-visible { outline: 3px solid #7cc7c9; outline-offset: 2px; }

  #count { color: var(--muted); margin: 0 0 12px; }
  #list { display: grid; gap: 12px; padding-bottom: 60px; }
  .item {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 6px solid var(--teal); border-radius: 10px; padding: 18px 20px;
  }
  .item.closed { border-left-color: var(--closed); }
  .item.closed h3 { color: var(--muted); }
  .item h3 { font-size: 1.3rem; }
  .who { color: var(--muted); margin: 2px 0 10px; }
  .desc { margin: 0 0 12px; max-width: 70ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: .95rem; }
  .facts b { font-weight: 600; }
  .deadline { color: var(--amber); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { background: #e2f1f1; color: var(--teal-dark); padding: 2px 10px; border-radius: 999px; font-size: .88rem; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button { padding: 6px 12px; font-size: .92rem; }
  .empty { text-align: center; color: var(--muted); padding: 48px 0; }

  dialog { border: none; border-radius: 12px; padding: 0; width: min(560px, 94vw); color: var(--ink); }
  dialog::backdrop { background: rgba(20, 33, 61, .55); }
  form { padding: 24px; display: grid; gap: 14px; }
  form h2 { font-size: 1.4rem; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; }
  label input, label select, label textarea {
    font: 400 1rem "Source Sans 3", sans-serif; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff;
  }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-end { display: flex; justify-content: flex-end; gap: 10px; }
  #msg { color: var(--danger); min-height: 1.4em; margin: 0; font-size: .95rem; }
  @media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Research opportunities</h1>
    <p>Browse open projects, see what skills they need, and check the application deadline before you reach out.</p>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <input type="search" id="q" placeholder="Search by title, area, faculty or skill" aria-label="Search opportunities">
    <select id="statusFilter" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="Open">Open</option>
      <option value="Closed">Closed</option>
    </select>
    <button class="primary" id="addBtn">Add opportunity</button>
  </div>
  <p id="count" aria-live="polite"></p>
  <section id="list"></section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add opportunity</h2>
    <label>Title <input name="title" required maxlength="150"></label>
    <label>Description <textarea name="description" rows="3" required maxlength="1000"></textarea></label>
    <div class="two">
      <label>Research area <input name="area" required></label>
      <label>Department <input name="department" required></label>
    </div>
    <div class="two">
      <label>Faculty name <input name="faculty" required></label>
      <label>Required skills <input name="skills" placeholder="Python, statistics" required></label>
    </div>
    <div class="two">
      <label>Available positions <input name="positions" type="number" min="0" required></label>
      <label>Application deadline <input name="deadline" type="date" required></label>
    </div>
    <label>Status
      <select name="status"><option>Open</option><option>Closed</option></select>
    </label>
    <p id="msg" role="alert"></p>
    <div class="row-end">
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const API = "/api/researchtitles";
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const dlg = document.getElementById("dlg");
const form = document.getElementById("form");
const msg = document.getElementById("msg");
let items = [];
let editingId = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

async function loadItems() {
  const res = await fetch(API);
  items = await res.json();
  draw();
}

function draw() {
  const term = document.getElementById("q").value.trim().toLowerCase();
  const status = document.getElementById("statusFilter").value;

  const shown = items.filter(o => {
    const haystack = [o.title, o.area, o.faculty, o.skills, o.department].join(" ").toLowerCase();
    return (!term || haystack.includes(term)) && (!status || o.status === status);
  });

  countEl.textContent = shown.length === 1 ? "1 opportunity" : shown.length + " opportunities";
  listEl.replaceChildren();

  if (!shown.length) {
    listEl.append(el("p", "empty", items.length
      ? "Nothing matches your search. Try fewer words or clear the status filter."
      : "No opportunities yet. Add the first one."));
    return;
  }

  shown.forEach(o => {
    const card = el("article", "item" + (o.status === "Closed" ? " closed" : ""));
    card.append(el("h3", "", o.title));
    card.append(el("p", "who", o.faculty + ", " + o.department));
    card.append(el("p", "desc", o.description));

    const facts = el("div", "facts");
    const pos = el("span"); pos.append(el("b", "", o.positions), document.createTextNode(o.positions === 1 ? " position" : " positions"));
    const dl = el("span", "deadline"); dl.append(document.createTextNode("Apply by "), el("b", "", fmtDate(o.deadline)));
    facts.append(pos, dl, el("span", "", "Area: " + o.area), el("span", "", "Status: " + o.status));
    card.append(facts);

    const chips = el("div", "chips");
    o.skills.split(",").map(s => s.trim()).filter(Boolean).forEach(s => chips.append(el("span", "chip", s)));
    card.append(chips);

    const actions = el("div", "actions");
    const edit = el("button", "ghost", "Edit");
    const del = el("button", "danger", "Delete");
    edit.onclick = () => openDialog(o);
    del.onclick = () => removeItem(o);
    actions.append(edit, del);
    card.append(actions);

    listEl.append(card);
  });
}

function openDialog(item) {
  editingId = item ? item.id : null;
  form.reset();
  msg.textContent = "";
  document.getElementById("dlgTitle").textContent = item ? "Edit opportunity" : "Add opportunity";
  if (item) {
    for (const [key, value] of Object.entries(item)) {
      if (form.elements[key]) form.elements[key].value = value;
    }
  }
  dlg.showModal();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const payload = Object.fromEntries(new FormData(form));
  payload.positions = Number(payload.positions);

  const res = await fetch(editingId ? `${API}/${editingId}` : API, {
    method: editingId ? "PUT" : "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    msg.textContent = err.error || "Could not save. Check the fields and try again.";
    return;
  }
  dlg.close();
  loadItems();
});

async function removeItem(item) {
  if (!confirm(`Delete "${item.title}"? This cannot be undone.`)) return;
  const res = await fetch(`${API}/${item.id}`, { method: "DELETE" });
  if (res.ok) loadItems();
}

document.getElementById("addBtn").onclick = () => openDialog(null);
document.getElementById("cancelBtn").onclick = () => dlg.close();
document.getElementById("q").addEventListener("input", draw);
document.getElementById("statusFilter").addEventListener("change", draw);

loadItems();
</script>
</body>
</html>
